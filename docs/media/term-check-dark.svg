<text x="477.0" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" fill="#8B98A5">hermes lineage check · verify</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">
<text x="26" y="77" xml:space="preserve"><tspan fill="#5B6873">$ </tspan><tspan fill="#E6EDF3" font-weight="600">hermes lineage check q3-note.md.receipt.json</tspan></text>
<text x="26" y="99" xml:space="preserve"><tspan fill="#E6EDF3">{</tspan></text>
<text x="26" y="121" xml:space="preserve"><tspan fill="#E6EDF3">  &quot;ok&quot;: </tspan><tspan fill="#7CC88A">true</tspan><tspan fill="#E6EDF3">,</tspan></text>
<text x="26" y="143" xml:space="preserve"><tspan fill="#E6EDF3">  &quot;file_matches_receipt&quot;: </tspan><tspan fill="#7CC88A">true</tspan><tspan fill="#E6EDF3">,</tspan></text>
<text x="26" y="165" xml:space="preserve"><tspan fill="#E6EDF3">  &quot;artifact_sha256_matches&quot;: </tspan><tspan fill="#7CC88A">true</tspan><tspan fill="#E6EDF3">,</tspan></text>
<text x="26" y="187" xml:space="preserve"><tspan fill="#E6EDF3">  &quot;receipt_sha256_matches&quot;: </tspan><tspan fill="#7CC88A">true</tspan><tspan fill="#E6EDF3">,</tspan></text>
<text x="26" y="209" xml:space="preserve"><tspan fill="#E6EDF3">  &quot;signature&quot;: &quot;</tspan><tspan fill="#7CC88A">valid</tspan><tspan fill="#E6EDF3">&quot;,</tspan></text>
<text x="26" y="231" xml:space="preserve"><tspan fill="#E6EDF3">  &quot;sources&quot;: 5,</tspan></text>
<text x="26" y="253" xml:space="preserve"><tspan fill="#E6EDF3">  &quot;schema&quot;: &quot;lineage.receipt.v1&quot;,</tspan></text>
<text x="26" y="275" xml:space="preserve"><tspan fill="#E6EDF3">  …</tspan></text>
<text x="26" y="297" xml:space="preserve"><tspan fill="#E6EDF3">}</tspan></text>
<text x="26" y="319" xml:space="preserve"><tspan fill="#5B6873" font-style="italic"># later, two sessions append Q4 rows to revenue.csv</tspan></text>
<text x="26" y="341" xml:space="preserve"><tspan fill="#5B6873">$ </tspan><tspan fill="#E6EDF3" font-weight="600">hermes lineage verify q3-note.md</tspan></text>
<text x="26" y="363" xml:space="preserve"><tspan fill="#E6EDF3">q3-note.md: </tspan><tspan fill="#7CC88A">unchanged</tspan><tspan fill="#E6EDF3">  </tspan><tspan fill="#5B6873">→</tspan><tspan fill="#E6EDF3"> verdict: </tspan><tspan fill="#F0A35E">stale</tspan></text>
<text x="26" y="385" xml:space="preserve"><tspan fill="#E6EDF3">  receipt: …/q3-note.md.receipt.json  signature </tspan><tspan fill="#7CC88A">valid</tspan><tspan fill="#E6EDF3">  </tspan><tspan fill="#7CC88A">hash ok</tspan></text>
<text x="26" y="407" xml:space="preserve"><tspan fill="#E6EDF3">  </tspan><tspan fill="#8B98A5">unchecked</tspan><tspan fill="#E6EDF3">   evidenced  </tspan><tspan fill="#5EC4CE">https://hermes-agent.nousresearch.com/docs</tspan></text>
<text x="26" y="429" xml:space="preserve"><tspan fill="#E6EDF3">  </tspan><tspan fill="#8B98A5">unchecked</tspan><tspan fill="#E6EDF3">   evidenced  </tspan><tspan fill="#5EC4CE">https://hermes-agent.nousresearch.com/docs/user-guide/features/plugin-</tspan></text>
<text x="26" y="451" xml:space="preserve"><tspan fill="#E6EDF3">  </tspan><tspan fill="#7CC88A">unchanged</tspan><tspan fill="#E6EDF3">   evidenced  chart.svg</tspan></text>
<text x="26" y="473" xml:space="preserve"><tspan fill="#E6EDF3">  </tspan><tspan fill="#F0A35E">changed</tspan><tspan fill="#E6EDF3">     evidenced  revenue.csv</tspan></text>
<text x="26" y="495" xml:space="preserve"><tspan fill="#E6EDF3">  </tspan><tspan fill="#7CC88A">unchanged</tspan><tspan fill="#E6EDF3">   </tspan><tspan fill="#8B98A5">inferred</tspan><tspan fill="#E6EDF3">   make_chart.py</tspan></text>
<text x="26" y="517" xml:space="preserve"><tspan fill="#E6EDF3">  URLs are </tspan><tspan fill="#8B98A5">unchecked</tspan><tspan fill="#E6EDF3">; `hermes lineage verify &lt;file&gt; --refetch` reaches the network to check them.</tspan></text>
</g></svg>