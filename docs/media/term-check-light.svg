<circle cx="22" cy="20" r="6" fill="#FF5F57"/><circle cx="42" cy="20" r="6" fill="#FEBC2E"/><circle cx="62" cy="20" r="6" fill="#28C840"/>
<text x="477.0" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" fill="#59636E">hermes lineage check · verify</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">
<text x="26" y="77" xml:space="preserve"><tspan fill="#8C959F">$ </tspan><tspan fill="#1F2328" font-weight="600">hermes lineage check q3-note.md.receipt.json</tspan></text>
<text x="26" y="99" xml:space="preserve"><tspan fill="#1F2328">{</tspan></text>
<text x="26" y="121" xml:space="preserve"><tspan fill="#1F2328">  &quot;ok&quot;: </tspan><tspan fill="#1A7F37">true</tspan><tspan fill="#1F2328">,</tspan></text>
<text x="26" y="143" xml:space="preserve"><tspan fill="#1F2328">  &quot;file_matches_receipt&quot;: </tspan><tspan fill="#1A7F37">true</tspan><tspan fill="#1F2328">,</tspan></text>
<text x="26" y="165" xml:space="preserve"><tspan fill="#1F2328">  &quot;artifact_sha256_matches&quot;: </tspan><tspan fill="#1A7F37">true</tspan><tspan fill="#1F2328">,</tspan></text>
<text x="26" y="187" xml:space="preserve"><tspan fill="#1F2328">  &quot;receipt_sha256_matches&quot;: </tspan><tspan fill="#1A7F37">true</tspan><tspan fill="#1F2328">,</tspan></text>
<text x="26" y="209" xml:space="preserve"><tspan fill="#1F2328">  &quot;signature&quot;: &quot;</tspan><tspan fill="#1A7F37">valid</tspan><tspan fill="#1F2328">&quot;,</tspan></text>
<text x="26" y="231" xml:space="preserve"><tspan fill="#1F2328">  &quot;sources&quot;: 5,</tspan></text>
<text x="26" y="253" xml:space="preserve"><tspan fill="#1F2328">  &quot;schema&quot;: &quot;lineage.receipt.v1&quot;,</tspan></text>
<text x="26" y="275" xml:space="preserve"><tspan fill="#1F2328">  …</tspan></text>
<text x="26" y="297" xml:space="preserve"><tspan fill="#1F2328">}</tspan></text>
<text x="26" y="319" xml:space="preserve"><tspan fill="#8C959F" font-style="italic"># later, two sessions append Q4 rows to revenue.csv</tspan></text>
<text x="26" y="341" xml:space="preserve"><tspan fill="#8C959F">$ </tspan><tspan fill="#1F2328" font-weight="600">hermes lineage verify q3-note.md</tspan></text>
<text x="26" y="363" xml:space="preserve"><tspan fill="#1F2328">q3-note.md: </tspan><tspan fill="#1A7F37">unchanged</tspan><tspan fill="#1F2328">  </tspan><tspan fill="#8C959F">→</tspan><tspan fill="#1F2328"> verdict: </tspan><tspan fill="#B35900">stale</tspan></text>
<text x="26" y="385" xml:space="preserve"><tspan fill="#1F2328">  receipt: …/q3-note.md.receipt.json  signature </tspan><tspan fill="#1A7F37">valid</tspan><tspan fill="#1F2328">  </tspan><tspan fill="#1A7F37">hash ok</tspan></text>
<text x="26" y="407" xml:space="preserve"><tspan fill="#1F2328">  </tspan><tspan fill="#59636E">unchecked</tspan><tspan fill="#1F2328">   evidenced  </tspan><tspan fill="#0A7C86">https://hermes-agent.nousresearch.com/docs</tspan></text>
<text x="26" y="429" xml:space="preserve"><tspan fill="#1F2328">  </tspan><tspan fill="#59636E">unchecked</tspan><tspan fill="#1F2328">   evidenced  </tspan><tspan fill="#0A7C86">https://hermes-agent.nousresearch.com/docs/user-guide/features/plugin-</tspan></text>
<text x="26" y="451" xml:space="preserve"><tspan fill="#1F2328">  </tspan><tspan fill="#1A7F37">unchanged</tspan><tspan fill="#1F2328">   evidenced  chart.svg</tspan></text>
<text x="26" y="473" xml:space="preserve"><tspan fill="#1F2328">  </tspan><tspan fill="#B35900">changed</tspan><tspan fill="#1F2328">     evidenced  revenue.csv</tspan></text>
<text x="26" y="495" xml:space="preserve"><tspan fill="#1F2328">  </tspan><tspan fill="#1A7F37">unchanged</tspan><tspan fill="#1F2328">   </tspan><tspan fill="#59636E">inferred</tspan><tspan fill="#1F2328">   make_chart.py</tspan></text>
<text x="26" y="517" xml:space="preserve"><tspan fill="#1F2328">  URLs are </tspan><tspan fill="#59636E">unchecked</tspan><tspan fill="#1F2328">; `hermes lineage verify &lt;file&gt; --refetch` reaches the network to check them.</tspan></text>
</g></svg>