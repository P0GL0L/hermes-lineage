name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pyyaml fastapi httpx
      - run: python -m pytest -q tests
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd tests-js && npm install --no-audit --no-fund && npm test
  admission:
    # The same checks the catalog runs at admission, against the current Hermes main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: astral-sh/setup-uv@v5
      - run: cd hermes-agent && uv sync --no-dev
      - run: cd hermes-agent && uv run hermes plugins validate ../plugin
